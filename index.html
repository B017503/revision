<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Study Ledger — Unit 3 Revision</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper: #F7F4EC;
            --rule: #D7CDBA;
            --ink: #221F1A;
            --ink-soft: #6B6455;
            --card: #FFFDF8;
            --margin: #B94B3E;
            --shadow: 5px 5px 0 rgba(34, 31, 26, 0.10);
            --shadow-sm: 3px 3px 0 rgba(34, 31, 26, 0.10);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            color: var(--ink);
            background-color: var(--paper);
            background-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 30px, var(--rule) 30px, var(--rule) 31px);
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        .mono {
            font-family: 'Space Mono', monospace;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        a {
            color: inherit;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 0 18px 90px;
        }

        /* ---------- HEADER ---------- */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 18px 10px;
            max-width: 760px;
            margin: 0 auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stamp {
            border: 3px solid var(--margin);
            color: var(--margin);
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 5px 8px;
            transform: rotate(-4deg);
            border-radius: 3px;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 700;
        }

        .brand-sub {
            font-size: 11px;
            color: var(--ink-soft);
            margin-top: 1px;
        }

        /* ---------- HOME: FOLDER CARDS ---------- */
        .home-title {
            font-size: 15px;
            color: var(--ink-soft);
            margin: 22px 2px 14px;
        }

        .folders {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media(max-width:480px) {
            .folders {
                grid-template-columns: 1fr;
            }
        }

        .folder {
            position: relative;
            background: var(--card);
            border: 2px solid var(--ink);
            border-radius: 2px;
            box-shadow: var(--shadow);
            padding: 18px 16px 16px 30px;
            cursor: pointer;
            transition: transform .12s ease;
        }

        .folder:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        .folder::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 14px;
            width: 56px;
            height: 14px;
            background: var(--card);
            border: 2px solid var(--ink);
            border-bottom: none;
            border-radius: 3px 3px 0 0;
        }

        .holes {
            position: absolute;
            left: 9px;
            top: 20px;
            bottom: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .holes span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--paper);
            border: 1.5px solid var(--ink-soft);
        }

        .folder .tag {
            display: inline-block;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .5px;
            padding: 2px 7px;
            border-radius: 2px;
            color: #fff;
            margin-bottom: 9px;
        }

        .folder h3 {
            font-size: 17px;
            line-height: 1.25;
            margin-bottom: 6px;
        }

        .folder p {
            font-size: 12px;
            color: var(--ink-soft);
        }

        /* topic accent colours */
        [data-topic="purpose"] .tag {
            background: #B94B3E;
        }

        [data-topic="income"] .tag {
            background: #2F6F4E;
        }

        [data-topic="expenditure"] .tag {
            background: #C08A1E;
        }

        [data-topic="finance"] .tag {
            background: #33578C;
        }

        .tip {
            margin-top: 24px;
            background: var(--card);
            border: 2px dashed var(--ink-soft);
            padding: 14px 16px;
            font-size: 13px;
            color: var(--ink-soft);
            border-radius: 2px;
        }

        .tip b {
            color: var(--ink);
        }

        /* ---------- TOPIC WORKSPACE ---------- */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
            margin: 18px 0 12px;
            background: none;
            border: none;
        }

        .topic-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .topic-head .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .topic-head h2 {
            font-size: 21px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 0;
        }

        .tab-btn {
            background: transparent;
            border: 2px solid var(--ink);
            border-bottom: none;
            padding: 9px 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px 6px 0 0;
            color: var(--ink-soft);
            position: relative;
            top: 2px;
        }

        .tab-btn.active {
            background: var(--card);
            color: var(--ink);
            top: 0;
        }

        /* ---------- LESSON (slideshow) ---------- */
        .lesson-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .slide-counter {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--ink-soft);
        }

        .skip-btn {
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 700;
            text-decoration: underline;
            color: var(--ink-soft);
        }

        .progress-track {
            height: 6px;
            background: var(--rule);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width .25s ease;
        }

        .slide-card {
            background: var(--card);
            border: 2px solid var(--ink);
            border-radius: 3px;
            box-shadow: var(--shadow);
            padding: 34px 26px;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .slide-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
        }

        .slide-kicker {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .slide-title {
            font-size: 24px;
            line-height: 1.25;
            margin-bottom: 18px;
            font-weight: 700;
        }

        .slide-points {
            list-style: none;
        }

        .slide-points li {
            font-size: 15px;
            line-height: 1.5;
            padding: 8px 0 8px 22px;
            position: relative;
            color: var(--ink);
            border-bottom: 1px dotted var(--rule);
        }

        .slide-points li:last-child {
            border-bottom: none;
        }

        .slide-points li::before {
            content: "—";
            position: absolute;
            left: 0;
            color: var(--ink-soft);
        }

        .lesson-nav {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .nav-btn {
            flex: 1;
            padding: 13px;
            border: 2px solid var(--ink);
            border-radius: 4px;
            background: var(--card);
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-sm);
        }

        .nav-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .nav-btn.primary {
            background: var(--ink);
            color: #fff;
        }

        .nav-btn:disabled {
            opacity: .35;
            cursor: default;
        }

        /* ---------- FLASHCARDS ---------- */
        .fc-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-size: 12px;
            color: var(--ink-soft);
            font-family: 'Space Mono', monospace;
        }

        .fc-stage {
            perspective: 1400px;
            margin-bottom: 18px;
        }

        .fc-card {
            position: relative;
            height: 250px;
            width: 100%;
            transform-style: preserve-3d;
            transition: transform .5s cubic-bezier(.4, .2, .2, 1);
            cursor: pointer;
        }

        .fc-card.flipped {
            transform: rotateY(180deg);
        }

        .fc-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border: 2px solid var(--ink);
            border-radius: 4px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .fc-front {
            color: #fff;
            background-image: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .08) 0 14px, rgba(255, 255, 255, 0) 14px 28px);
        }

        .fc-back {
            background: var(--card);
            transform: rotateY(180deg);
        }

        .fc-label {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
            opacity: .75;
            margin-bottom: 10px;
        }

        .fc-term {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
        }

        .fc-def {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.5;
        }

        .fc-hint {
            position: absolute;
            bottom: 12px;
            font-size: 11px;
            color: var(--ink-soft);
            font-family: 'Space Mono', monospace;
        }

        .fc-controls {
            display: flex;
            gap: 8px;
        }

        .fc-controls .nav-btn {
            flex: 0 0 46px;
            font-size: 16px;
        }

        .fc-mid-btn {
            flex: 1;
            padding: 13px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 13px;
            border: 2px solid;
            box-shadow: var(--shadow-sm);
        }

        .fc-mid-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .fc-know {
            border-color: #2F6F4E;
            background: #EAF4EE;
            color: #204B36;
        }

        .fc-again {
            border-color: #B94B3E;
            background: #FBEAE7;
            color: #7C3126;
        }

        /* ---------- QUIZ ---------- */
        .q-card {
            background: var(--card);
            border: 2px solid var(--ink);
            border-radius: 3px;
            box-shadow: var(--shadow);
            padding: 22px;
            margin-bottom: 16px;
        }

        .q-kicker {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--ink-soft);
            margin-bottom: 10px;
        }

        .q-text {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.35;
        }

        .options {
            list-style: none;
        }

        .opt {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border: 2px solid var(--ink);
            border-radius: 4px;
            padding: 12px 14px;
            margin-bottom: 9px;
            background: var(--card);
            font-size: 14px;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .opt:not(.disabled):active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .opt.correct {
            background: #EAF4EE;
            border-color: #2F6F4E;
            color: #204B36;
        }

        .opt.wrong {
            background: #FBEAE7;
            border-color: #B94B3E;
            color: #7C3126;
        }

        .opt.faded {
            opacity: .4;
        }

        .opt-mark {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
        }

        .hint-btn {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 700;
            text-decoration: underline;
            color: var(--ink-soft);
            margin-top: 6px;
        }

        .hint-box {
            background: #FCF3DC;
            border: 2px dashed #C08A1E;
            padding: 10px 14px;
            font-size: 13px;
            margin-top: 8px;
            border-radius: 3px;
            color: #6B4F14;
        }

        .explain-box {
            background: var(--paper);
            border: 2px solid var(--ink);
            border-radius: 3px;
            padding: 14px 16px;
            margin-top: 14px;
        }

        .explain-tag {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .explain-text {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .quiz-done {
            text-align: center;
            padding: 40px 16px;
        }

        .quiz-done .score {
            font-family: 'Space Mono', monospace;
            font-size: 44px;
            font-weight: 700;
            margin: 14px 0 6px;
        }

        /* ---------- BOTTOM NAV (mobile) ---------- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            border-top: 2px solid var(--ink);
            display: none;
            z-index: 50;
        }

        .bottom-nav-inner {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
        }

        .bn-btn {
            flex: 1;
            padding: 10px 4px calc(8px + env(safe-area-inset-bottom));
            background: none;
            border: none;
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-soft);
        }

        .bn-btn.active {
            color: var(--ink);
        }

        .bn-icon {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            margin-bottom: 2px;
        }

        @media(max-width:600px) {
            .bottom-nav {
                display: block;
            }

            body {
                padding-bottom: 56px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <header class="site-header">
        <div class="brand">
            <div class="stamp">REVISED</div>
            <div>
                <div class="brand-name">Study Ledger</div>
                <div class="brand-sub">Unit 3 · Personal &amp; Business Finance</div>
            </div>
        </div>
    </header>

    <div class="wrap" id="app"></div>

    <div class="bottom-nav" id="bottomNav"></div>

    <script>
        /* =========================================================
           DATA
           ========================================================= */
        const TOPICS = [
            { id: "purpose", name: "Purpose of Accounting", short: "Purpose", accent: "#B94B3E", accentSoft: "#FBEAE7" },
            { id: "income", name: "Types of Income", short: "Income", accent: "#2F6F4E", accentSoft: "#EAF4EE" },
            { id: "expenditure", name: "Types of Expenditure", short: "Expenditure", accent: "#C08A1E", accentSoft: "#FCF3DC" },
            { id: "finance", name: "Sources of Finance", short: "Finance", accent: "#33578C", accentSoft: "#E9EFF7" }
        ];
        const topicById = Object.fromEntries(TOPICS.map(t => [t.id, t]));

        const LESSONS = {
            purpose: [
                { title: "What is accounting?", points: ["Recording financial transactions — money in and money out", "Turning those records into financial information", "Poor records make business failure far more likely"] },
                { title: "Record transactions", points: ["Track all sales (money in) and expenses (money out)", "Missing this = unpaid bills, chasing payments", "Wrong records = wrong tax paid to HMRC"] },
                { title: "Management", points: ["Managers plan, monitor and control resources", "Balances cash coming in vs wages, stock, bills going out"] },
                { title: "Compliance", points: ["Laws & regulations force fair, accurate reporting", "Protects investors from being misled", "Helps guard against fraud"] },
                { title: "Measuring performance", points: ["Gross profit = sales revenue − cost of goods sold", "Net profit = gross profit − other expenses", "Shows money owed to and by the business"] },
                { title: "Control", points: ["Trade receivables = owed TO the business", "Trade payables = owed BY the business", "Credit control = getting paid on time"] },
                { title: "Key terms recap", points: ["HMRC — collects UK taxes", "Fraud — money taken illegally for personal gain", "Asset — anything of value owned by a business", "Amortisation — spreading the repayment of a loan, or the cost of an intangible asset, over a set timeframe"] }
            ],
            income: [
                { title: "Two types of income", points: ["Capital income — sets up or grows the business, long-term", "Revenue income — day-to-day trading money"] },
                { title: "Loans & mortgages", points: ["Loan — lump sum + interest, often secured on an asset", "Mortgage — bigger sum, longer term (~25 yrs), secured on property"] },
                { title: "Shares & owner's capital", points: ["Shares — sold to shareholders, who get a vote + dividend", "Owner's capital — the owner's own savings, high personal risk"] },
                { title: "Debentures", points: ["Medium- to long-term loan capital", "Fixed interest, repaid as a lump sum"] },
                { title: "Sales & rent received", points: ["Sales — cash sales (pay now) or credit sales (pay later)", "Rent received — income from renting out property you own"] },
                { title: "Commission & interest received", points: ["Commission — % fee for selling on behalf of another business", "Interest received — earned on savings or money lent out"] },
                { title: "Discount received", points: ["A % off given to YOUR business", "Usually for quick payment or a bulk order"] }
            ],
            expenditure: [
                { title: "Two types of expenditure", points: ["Capital expenditure — buys long-term capital items", "Revenue expenditure — day-to-day running costs"] },
                { title: "Non-current assets", points: ["Land, premises, machinery, vehicles, fixtures", "Shown on the statement of financial position", "Most lose value over time → depreciated"] },
                { title: "Goodwill & patents", points: ["Goodwill — value of a business's reputation & customer base", "Patents — legal protection of an invention"] },
                { title: "Trademarks & brand name", points: ["Trademark — symbol, logo, name or colour that sets a business apart", "Brand name — builds customer expectations"] },
                { title: "Premises costs", points: ["Rent — using premises you don't own", "Rates — paid to council for local services", "Heating, lighting & water — regular utility bills"] },
                { title: "Insurance", points: ["Buildings & contents insurance", "Public liability & employers' liability insurance"] },
                { title: "Staffing costs", points: ["Salary — fixed annual amount, paid monthly", "Wage — hourly rate × hours worked"] },
                { title: "Other running costs", points: ["Marketing, administration, bank charges, interest paid"] },
                { title: "Depreciation & discount allowed", points: ["Depreciation — spreads an asset's cost over its useful life", "Straight-line = same amount depreciated each year", "Discount allowed — % off given TO customers"] }
            ],
            finance: [
                { title: "Internal vs external", points: ["Internal — money from within the business", "External — money from outside the business", "Short-term = repaid within 1 year, long-term = over 1 year"] },
                { title: "Retained profit", points: ["+ No interest charges, available immediately", "− Limited to what's already been earned"] },
                { title: "Net current assets", points: ["Current assets minus current liabilities", "+ Encourages good cash-flow management", "− Can strain supplier or customer relationships"] },
                { title: "Sale of assets", points: ["+ No interest, frees up capital tied up in assets", "− May sell for less than the asset's true value"] },
                { title: "Loans & mortgages", points: ["+ Regular repayments, ownership not lost", "− Interest charged, often secured against an asset"] },
                { title: "Crowd-funding", points: ["+ Reaches a large number of investors online", "− Partial loss of ownership, no guarantee of success"] },
                { title: "Venture capital", points: ["+ Comes with expert advice and mentoring", "− Loss of ownership & control, possible conflict"] },
                { title: "Debt factoring", points: ["+ Speeds up cash flow, factor takes on bad-debt risk", "− Business only receives a % of what's owed"] },
                { title: "Hire purchase & leasing", points: ["Both spread the cost of an asset over time", "− Total cost is usually higher than buying outright", "Leasing — you never own the asset"] },
                { title: "Trade credit", points: ["+ Delays payment, helps cash flow", "− Short-term only, may lose early-payment discounts"] },
                { title: "Grants & donations", points: ["+ No repayment or interest charges", "− Grants need lengthy applications; donations are small & unpredictable"] },
                { title: "Peer-to-peer & invoice discounting", points: ["Peer-to-peer lending — can beat bank interest rates", "Invoice discounting — no repayment, but often cash-only"] }
            ]
        };

        const TERMS = {
            purpose: [
                ["Financial transactions", "Money going into or out of a business, e.g. a sale or paying a bill."],
                ["HMRC", "UK government department that collects all types of taxes."],
                ["Fraud", "Company money used inappropriately or acquired by the wrong person for personal gain."],
                ["Profit", "Revenue is higher than total costs."],
                ["Loss", "Revenue is lower than total costs."],
                ["Gross profit", "Sales revenue minus cost of goods sold."],
                ["Net profit", "Gross profit minus other expenses (rent, advertising, etc.)."],
                ["Trade receivables", "Money owed TO the business from sales not yet paid for."],
                ["Trade payables", "Money the business owes for goods/services not yet paid for."],
                ["Asset", "Any item of value owned by a person or business."],
                ["Amortisation", "Spreading the repayment of a loan, or the cost of an intangible asset, over a specific timeframe."]
            ],
            income: [
                ["Capital income", "Money invested to set up or grow a business — long-term."],
                ["Revenue income", "Money from day-to-day trading — selling goods or services."],
                ["Fixed assets", "Items that stay in the business over a year, e.g. machinery."],
                ["Debenture", "Medium/long-term loan capital with fixed interest, repaid as a lump sum."],
                ["Commission", "A fee (flat or %) paid for completing a sale on someone else's behalf."],
                ["Owner's capital", "Money invested from the owner's own personal savings."]
            ],
            expenditure: [
                ["Capital expenditure", "Spending on capital items that stay in the business long-term."],
                ["Revenue expenditure", "Spending on day-to-day running costs."],
                ["Statement of financial position", "Balance sheet — shows assets vs liabilities."],
                ["Depreciation", "Spreading an asset's cost over its useful life."],
                ["Intangible asset", "Adds value but can't be touched, e.g. goodwill, patents."],
                ["Capital items", "Assets bought from capital expenditure, e.g. machinery, vehicles."]
            ],
            finance: [
                ["Internal sources of finance", "Money available to fund spending from within the business."],
                ["External sources of finance", "Money that comes from outside the business."],
                ["Short-term finance", "Paid back within one year."],
                ["Long-term finance", "Paid back over more than one year."],
                ["Venture capital", "Investment from an experienced entrepreneur for a stake (equity) in the business."]
            ]
        };

        const QUIZ = {
            purpose: [
                { q: "Why does a business need to keep accurate records of money in and out?", options: ["So the office looks organised", "To avoid trouble with HMRC and report performance accurately", "To reduce the number of staff needed", "To avoid paying rent"], correct: 1, hint: "Think about who collects tax.", explain: "Bad records mean unpaid bills, missed payments, and wrong tax figures to HMRC." },
                { q: "What is net profit?", options: ["Sales revenue minus cost of goods sold", "Gross profit minus other expenses (rent, advertising, etc.)", "The total amount owed to the business", "Total sales revenue only"], correct: 1, hint: "It comes AFTER gross profit.", explain: "Net profit = gross profit − other expenses like rent and advertising." },
                { q: "A trade receivable is...", options: ["Money the business owes to suppliers", "Money owed TO the business from unpaid sales", "A type of bank loan", "A fixed asset like machinery"], correct: 1, hint: "'Receivable' — the business is going to RECEIVE it.", explain: "Trade receivables = money owed to the business from sales not yet paid for." },
                { q: "Compliance with financial laws mainly helps to...", options: ["Reduce staff wages", "Protect investors and guard against fraud", "Increase sales instantly", "Avoid paying rates"], correct: 1, hint: "It's about trust and honesty in the numbers.", explain: "Regulations ensure records are fair and accurate, protecting stakeholders and preventing fraud." },
                { q: "Fraud is best described as...", options: ["A legal business expense", "Company money used inappropriately or acquired by the wrong person for personal gain", "A type of tax", "A financial statement"], correct: 1, hint: "It's illegal.", explain: "Fraud = money acquired by the wrong person for personal gain, through illegal actions." }
            ],
            income: [
                { q: "Which of these is a source of CAPITAL income?", options: ["Sales", "Rent received", "Mortgage", "Commission received"], correct: 2, hint: "Capital income sets up or grows the business long-term.", explain: "A mortgage is a long-term loan used to buy premises — capital income." },
                { q: "A debenture is...", options: ["A short-term overdraft", "Medium/long-term loan capital, fixed interest, repaid as a lump sum", "A type of share issued to the public", "Revenue earned from sales"], correct: 1, hint: "It's a form of loan capital.", explain: "Debentures are medium- to long-term loan capital with fixed interest, repaid in a lump sum." },
                { q: "Commission received is money earned from...", options: ["Interest on savings", "Selling another business's product or service as their agent", "Renting out property", "A supplier's discount"], correct: 1, hint: "Think 'estate agent' or 'ticket seller'.", explain: "Commission is a % fee earned for completing a sale on behalf of another business." },
                { q: "A sole trader mainly raises capital income through...", options: ["Issuing shares to the public", "Owner's capital and personal loans", "Venture capital only", "Debentures only"], correct: 1, hint: "Sole traders can't issue shares.", explain: "Sole traders rely on their own savings or personal loans, often secured on their home." },
                { q: "Discount received happens when...", options: ["A business gives customers money off", "A business is given a % off a purchase, e.g. for quick payment", "A business borrows money from a bank", "A business pays its rent"], correct: 1, hint: "'Received' — the business is on the receiving end.", explain: "Discount received reduces the business's own costs, e.g. from a supplier." }
            ],
            expenditure: [
                { q: "Which of these is an intangible asset?", options: ["Machinery", "Goodwill", "Premises", "Vehicles"], correct: 1, hint: "It can't be touched.", explain: "Goodwill, patents, trademarks and brand name are intangible assets." },
                { q: "Depreciation is...", options: ["Money earned on savings", "A technique to spread an asset's cost over its useful life", "A type of insurance", "A type of revenue income"], correct: 1, hint: "It matches cost to how long you use the asset.", explain: "Depreciation spreads the cost of an asset (e.g. a £50,000 machine) over its useful life." },
                { q: "Which of these is REVENUE expenditure?", options: ["Buying a factory", "Buying a patent", "Paying staff wages", "Buying new machinery"], correct: 2, hint: "Which one happens every week or month?", explain: "Wages are a regular, day-to-day cost — revenue expenditure." },
                { q: "A trademark protects...", options: ["An invention or process", "A symbol, logo, brand name or colour that sets a business apart", "A building", "A company vehicle"], correct: 1, hint: "Think of a distinctive colour like Cadbury purple.", explain: "Trademarks distinguish a business's goods/services and build brand loyalty." },
                { q: "Employers' liability insurance protects against...", options: ["Fire damage to a building", "Claims if an employee is injured at work", "Flood damage to stock", "Accidents to members of the public"], correct: 1, hint: "It's about the EMPLOYEE, not the building or public.", explain: "Employers' liability insurance covers compensation/legal costs if an employee is hurt at work." }
            ],
            finance: [
                { q: "Retained profit is an example of...", options: ["External finance", "Internal finance", "A grant", "A mortgage"], correct: 1, hint: "It comes from inside the business.", explain: "Retained profit is profit kept inside the business — an internal source of finance." },
                { q: "A key disadvantage of a bank loan is...", options: ["No interest is ever charged", "Interest must be paid regardless of profit, often secured against an asset", "It never needs repaying", "It's only available to shareholders"], correct: 1, hint: "What happens if the business isn't doing well?", explain: "Loan interest is charged whether or not the business is profitable, and can be secured against assets." },
                { q: "Crowd-funding's main advantage is that it...", options: ["Guarantees the funding target will be reached", "Raises finance from a large number of investors, often online", "Means giving up total control immediately", "Comes with zero risk"], correct: 1, hint: "Think 'crowd' — lots of small investors.", explain: "Crowd-funding attracts many investors, often via the internet, but there's no guarantee it will succeed." },
                { q: "Debt factoring involves...", options: ["Buying extra stock on credit", "Selling a business's debts to a third party for quick cash", "Renting equipment instead of buying it", "A type of insurance for debts"], correct: 1, hint: "A 'factor' company takes over the debt-chasing.", explain: "The factor pays a % of the debt upfront and takes on the job (and risk) of collecting it." },
                { q: "A key disadvantage of leasing is that...", options: ["You own the asset immediately", "The overall cost is usually higher than buying outright, and you never own the asset", "It needs a large upfront deposit", "There are no ongoing payments"], correct: 1, hint: "Who keeps ownership throughout a lease?", explain: "Leasing spreads cost but ownership stays with the supplier and total cost is usually higher." }
            ]
        };

        /* =========================================================
           STATE
           ========================================================= */
        let state = {
            view: "home",       // home | topic
            topic: null,
            mode: "lesson",      // lesson | cards | quiz
            lessonIndex: 0,
            cardIndex: 0,
            cardFlipped: false,
            cardKnown: {},
            quizIndex: 0,
            quizSelected: null,
            quizScore: 0,
            quizDone: false,
            showHint: false
        };

        const app = document.getElementById("app");
        const bottomNav = document.getElementById("bottomNav");

        function go(view, opts = {}) {
            state.view = view;
            Object.assign(state, opts);
            render();
        }
        function openTopic(id, mode) {
            state.topic = id;
            state.mode = mode || "lesson";
            state.lessonIndex = 0; state.cardIndex = 0; state.cardFlipped = false;
            state.quizIndex = 0; state.quizSelected = null; state.quizScore = 0; state.quizDone = false; state.showHint = false;
            go("topic");
        }
        function setMode(mode) {
            state.mode = mode;
            state.lessonIndex = 0; state.cardIndex = 0; state.cardFlipped = false;
            state.quizIndex = 0; state.quizSelected = null; state.quizScore = 0; state.quizDone = false; state.showHint = false;
            render();
        }

        /* =========================================================
           RENDER: HOME
           ========================================================= */
        function renderHome() {
            bottomNav.innerHTML = "";
            app.innerHTML = `
    <p class="home-title">Choose a topic to start.</p>
    <div class="folders">
      ${TOPICS.map(t => `
        <div class="folder" data-topic="${t.id}" onclick="openTopic('${t.id}')">
          <div class="holes"><span></span><span></span><span></span></div>
          <span class="tag">${t.short.toUpperCase()}</span>
          <h3>${t.name}</h3>
          <p>Lesson · Flashcards · Quiz</p>
        </div>
      `).join("")}
    </div>
    <div class="tip"><b>How to use this:</b> run the Lesson slideshow first to see the facts in order, then drill weak spots with Flashcards, then check yourself with the Quiz.</div>
  `;
        }

        /* =========================================================
           RENDER: TOPIC WORKSPACE
           ========================================================= */
        function renderTopic() {
            const t = topicById[state.topic];
            document.documentElement.style.setProperty("--current-accent", t.accent);

            let body = "";
            if (state.mode === "lesson") body = renderLesson(t);
            if (state.mode === "cards") body = renderCards(t);
            if (state.mode === "quiz") body = renderQuiz(t);

            app.innerHTML = `
    <button class="back-link" onclick="go('home')">&larr; All topics</button>
    <div class="topic-head">
      <span class="dot" style="background:${t.accent}"></span>
      <h2>${t.name}</h2>
    </div>
    <div class="tabs">
      <button class="tab-btn ${state.mode === 'lesson' ? 'active' : ''}" onclick="setMode('lesson')">Lesson</button>
      <button class="tab-btn ${state.mode === 'cards' ? 'active' : ''}" onclick="setMode('cards')">Flashcards</button>
      <button class="tab-btn ${state.mode === 'quiz' ? 'active' : ''}" onclick="setMode('quiz')">Quiz</button>
    </div>
    ${body}
  `;

            bottomNav.innerHTML = `
    <div class="bottom-nav-inner">
      <button class="bn-btn ${state.mode === 'lesson' ? 'active' : ''}" onclick="setMode('lesson')"><span class="bn-icon">≡</span>Lesson</button>
      <button class="bn-btn ${state.mode === 'cards' ? 'active' : ''}" onclick="setMode('cards')"><span class="bn-icon">▭▭</span>Cards</button>
      <button class="bn-btn ${state.mode === 'quiz' ? 'active' : ''}" onclick="setMode('quiz')"><span class="bn-icon">?</span>Quiz</button>
      <button class="bn-btn" onclick="go('home')"><span class="bn-icon">⌂</span>Topics</button>
    </div>
  `;
        }

        /* ---------- LESSON ---------- */
        function renderLesson(t) {
            const slides = LESSONS[t.id];
            const i = state.lessonIndex;
            const s = slides[i];
            const pct = Math.round(((i + 1) / slides.length) * 100);
            return `
    <div class="lesson-topbar">
      <span class="slide-counter">SLIDE ${i + 1} / ${slides.length}</span>
      <button class="skip-btn" onclick="lessonJump(${slides.length - 1})">Skip to end</button>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${t.accent}"></div></div>
    <div class="slide-card">
      <div style="position:absolute; left:0; top:0; bottom:0; width:5px; background:${t.accent}"></div>
      <div class="slide-kicker" style="color:${t.accent}">${t.short.toUpperCase()}</div>
      <h3 class="slide-title">${s.title}</h3>
      <ul class="slide-points">${s.points.map(p => `<li>${p}</li>`).join("")}</ul>
    </div>
    <div class="lesson-nav">
      <button class="nav-btn" ${i === 0 ? 'disabled' : ''} onclick="lessonJump(${i - 1})">&larr; Back</button>
      ${i === slides.length - 1
                    ? `<button class="nav-btn primary" onclick="setMode('quiz')">Take the quiz &rarr;</button>`
                    : `<button class="nav-btn primary" onclick="lessonJump(${i + 1})">Next &rarr;</button>`
                }
    </div>
  `;
        }
        function lessonJump(i) { state.lessonIndex = i; render(); }

        /* ---------- FLASHCARDS ---------- */
        function renderCards(t) {
            const terms = TERMS[t.id];
            const i = state.cardIndex;
            const [term, def] = terms[i];
            const knownCount = Object.keys(state.cardKnown).filter(k => k.startsWith(t.id + "-") && state.cardKnown[k]).length;
            return `
    <div class="fc-topbar">
      <span>${i + 1} / ${terms.length}</span>
      <span>${knownCount} known</span>
    </div>
    <div class="fc-stage">
      <div class="fc-card ${state.cardFlipped ? 'flipped' : ''}" onclick="flipCard()">
        <div class="fc-face fc-front" style="background:${t.accent}">
          <div class="fc-label">TERM</div>
          <div class="fc-term">${term}</div>
          <div class="fc-hint" style="color:rgba(255,255,255,.75)">tap to flip</div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-label" style="color:${t.accent}">DEFINITION</div>
          <div class="fc-def">${def}</div>
        </div>
      </div>
    </div>
    <div class="fc-controls">
      <button class="nav-btn" onclick="cardStep(-1)">&larr;</button>
      <button class="fc-mid-btn fc-again" onclick="markCard(false)">Still learning</button>
      <button class="fc-mid-btn fc-know" onclick="markCard(true)">Know it</button>
      <button class="nav-btn" onclick="cardStep(1)">&rarr;</button>
    </div>
  `;
        }
        function flipCard() { state.cardFlipped = !state.cardFlipped; render(); }
        function cardStep(dir) {
            const terms = TERMS[state.topic];
            state.cardFlipped = false;
            state.cardIndex = (state.cardIndex + dir + terms.length) % terms.length;
            render();
        }
        function markCard(known) {
            state.cardKnown[state.topic + "-" + state.cardIndex] = known;
            cardStep(1);
        }

        /* ---------- QUIZ ---------- */
        function renderQuiz(t) {
            const qs = QUIZ[t.id];
            if (state.quizDone) {
                const pct = Math.round((state.quizScore / qs.length) * 100);
                let msg = "Worth another pass — check the Lesson slides first.";
                if (state.quizScore === qs.length) msg = "Perfect score. Try another topic.";
                else if (pct >= 50) msg = "Solid work — review the ones you missed and go again.";
                return `
      <div class="q-card quiz-done">
        <div class="q-kicker" style="color:${t.accent}">RESULT</div>
        <div class="score">${state.quizScore}/${qs.length}</div>
        <p style="color:var(--ink-soft); margin-bottom:18px;">${msg}</p>
        <button class="nav-btn primary" onclick="setMode('quiz')">Retry this topic</button>
      </div>
    `;
            }
            const i = state.quizIndex;
            const q = qs[i];
            const answered = state.quizSelected !== null;
            return `
    <div class="q-card">
      <div class="q-kicker" style="color:${t.accent}">QUESTION ${i + 1} OF ${qs.length} &nbsp;·&nbsp; SCORE ${state.quizScore}</div>
      <div class="q-text">${q.q}</div>
    </div>
    <ul class="options">
      ${q.options.map((opt, oi) => {
                let cls = "opt";
                if (answered) {
                    if (oi === q.correct) cls += " correct";
                    else if (oi === state.quizSelected) cls += " wrong";
                    else cls += " faded";
                }
                let mark = "";
                if (answered && oi === q.correct) mark = "✓";
                if (answered && oi === state.quizSelected && oi !== q.correct) mark = "✕";
                return `<li class="${cls}" onclick="${answered ? '' : 'chooseOption(' + oi + ')'}"><span>${opt}</span><span class="opt-mark">${mark}</span></li>`;
            }).join("")}
    </ul>
    ${!answered ? `
      <button class="hint-btn" onclick="toggleHint()">${state.showHint ? 'Hide hint' : 'Show hint'}</button>
      ${state.showHint ? `<div class="hint-box">${q.hint}</div>` : ""}
    ` : `
      <div class="explain-box">
        <div class="explain-tag" style="color:${t.accent}">${state.quizSelected === q.correct ? "CORRECT" : "NOT QUITE"}</div>
        <div class="explain-text">${q.explain}</div>
        <button class="nav-btn primary" onclick="nextQuestion()">${i + 1 >= qs.length ? "See results →" : "Next question →"}</button>
      </div>
    `}
  `;
        }
        function chooseOption(oi) {
            const q = QUIZ[state.topic][state.quizIndex];
            state.quizSelected = oi;
            state.showHint = false;
            if (oi === q.correct) state.quizScore++;
            render();
        }
        function toggleHint() { state.showHint = !state.showHint; render(); }
        function nextQuestion() {
            const qs = QUIZ[state.topic];
            if (state.quizIndex + 1 >= qs.length) { state.quizDone = true; }
            else { state.quizIndex++; state.quizSelected = null; state.showHint = false; }
            render();
        }

        /* =========================================================
           MAIN RENDER
           ========================================================= */
        function render() {
            if (state.view === "home") renderHome();
            else renderTopic();
            window.scrollTo(0, 0);
        }
        render();
    </script>
</body>

</html>
