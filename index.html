<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Study Ledger — Unit 3 Revision</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --paper: #F7F4EC;
            --rule: #D7CDBA;
            --ink: #221F1A;
            --ink-soft: #6B6455;
            --card: #FFFDF8;
            --margin: #B94B3E;
            --shadow: 5px 5px 0 rgba(34, 31, 26, 0.10);
            --shadow-sm: 3px 3px 0 rgba(34, 31, 26, 0.10);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            color: var(--ink);
            background-color: var(--paper);
            background-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 30px, var(--rule) 30px, var(--rule) 31px);
            min-height: 100vh;
        }

        h1,
        h2,
        h3,
        .mono {
            font-family: 'Space Mono', monospace;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        a {
            color: inherit;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
            padding: 0 18px 90px;
        }

        /* ---------- HEADER ---------- */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 22px 18px 10px;
            max-width: 760px;
            margin: 0 auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stamp {
            border: 3px solid var(--margin);
            color: var(--margin);
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 11px;
            letter-spacing: 1px;
            padding: 5px 8px;
            transform: rotate(-4deg);
            border-radius: 3px;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 700;
        }

        .brand-sub {
            font-size: 11px;
            color: var(--ink-soft);
            margin-top: 1px;
        }

        /* ---------- HOME: FOLDER CARDS ---------- */
        .home-title {
            font-size: 15px;
            color: var(--ink-soft);
            margin: 22px 2px 14px;
        }

        .folders {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        @media(max-width:480px) {
            .folders {
                grid-template-columns: 1fr;
            }
        }

        .folder {
            position: relative;
            background: var(--card);
            border: 2px solid var(--ink);
            border-radius: 2px;
            box-shadow: var(--shadow);
            padding: 18px 16px 16px 30px;
            cursor: pointer;
            transition: transform .12s ease;
        }

        .folder:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        .folder::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 14px;
            width: 56px;
            height: 14px;
            background: var(--card);
            border: 2px solid var(--ink);
            border-bottom: none;
            border-radius: 3px 3px 0 0;
        }

        .holes {
            position: absolute;
            left: 9px;
            top: 20px;
            bottom: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .holes span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--paper);
            border: 1.5px solid var(--ink-soft);
        }

        .folder .tag {
            display: inline-block;
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .5px;
            padding: 2px 7px;
            border-radius: 2px;
            color: #fff;
            margin-bottom: 9px;
        }

        .folder h3 {
            font-size: 17px;
            line-height: 1.25;
            margin-bottom: 6px;
        }

        .folder p {
            font-size: 12px;
            color: var(--ink-soft);
        }

        /* topic accent colours */
        [data-topic="purpose"] .tag {
            background: #B94B3E;
        }

        [data-topic="income"] .tag {
            background: #2F6F4E;
        }

        [data-topic="expenditure"] .tag {
            background: #C08A1E;
        }

        [data-topic="finance"] .tag {
            background: #33578C;
        }

        .tip {
            margin-top: 24px;
            background: var(--card);
            border: 2px dashed var(--ink-soft);
            padding: 14px 16px;
            font-size: 13px;
            color: var(--ink-soft);
            border-radius: 2px;
        }

        .tip b {
            color: var(--ink);
        }

        /* ---------- TOPIC WORKSPACE ---------- */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink-soft);
            margin: 18px 0 12px;
            background: none;
            border: none;
        }

        .topic-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .topic-head .dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .topic-head h2 {
            font-size: 21px;
        }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--ink);
            padding-bottom: 0;
        }

        .tab-btn {
            background: transparent;
            border: 2px solid var(--ink);
            border-bottom: none;
            padding: 9px 14px;
            font-size: 13px;
            font-weight: 700;
            border-radius: 6px 6px 0 0;
            color: var(--ink-soft);
            position: relative;
            top: 2px;
        }

        .tab-btn.active {
            background: var(--card);
            color: var(--ink);
            top: 0;
        }

        /* ---------- LESSON (slideshow) ---------- */
        .lesson-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .slide-counter {
            font-family: 'Space Mono', monospace;
            font-size: 12px;
            color: var(--ink-soft);
        }

        .skip-btn {
            background: none;
            border: none;
            font-size: 12px;
            font-weight: 700;
            text-decoration: underline;
            color: var(--ink-soft);
        }

        .progress-track {
            height: 6px;
            background: var(--rule);
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width .25s ease;
        }

        .slide-card {
            background: var(--card);
            border: 2px solid var(--ink);
            border-radius: 3px;
            box-shadow: var(--shadow);
            padding: 34px 26px;
            min-height: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .slide-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
        }

        .slide-kicker {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .slide-title {
            font-size: 24px;
            line-height: 1.25;
            margin-bottom: 18px;
            font-weight: 700;
        }

        .slide-points {
            list-style: none;
        }

        .slide-points li {
            font-size: 15px;
            line-height: 1.5;
            padding: 8px 0 8px 22px;
            position: relative;
            color: var(--ink);
            border-bottom: 1px dotted var(--rule);
        }

        .slide-points li:last-child {
            border-bottom: none;
        }

        .slide-points li::before {
            content: "—";
            position: absolute;
            left: 0;
            color: var(--ink-soft);
        }

        .slide-points li strong {
            font-weight: 700;
        }

        .sub-point {
            display: block;
            margin-top: 5px;
            padding-left: 15px;
            position: relative;
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--ink-soft);
        }

        .sub-point::before {
            content: "›";
            position: absolute;
            left: 0;
            color: var(--ink-soft);
        }

        .lesson-nav {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .nav-btn {
            flex: 1;
            padding: 13px;
            border: 2px solid var(--ink);
            border-radius: 4px;
            background: var(--card);
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow-sm);
        }

        .nav-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .nav-btn.primary {
            background: var(--ink);
            color: #fff;
        }

        .nav-btn:disabled {
            opacity: .35;
            cursor: default;
        }

        /* ---------- FLASHCARDS ---------- */
        .fc-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-size: 12px;
            color: var(--ink-soft);
            font-family: 'Space Mono', monospace;
        }

        .fc-stage {
            perspective: 1400px;
            margin-bottom: 18px;
        }

        .fc-card {
            position: relative;
            height: 250px;
            width: 100%;
            transform-style: preserve-3d;
            transition: transform .5s cubic-bezier(.4, .2, .2, 1);
            cursor: pointer;
        }

        .fc-card.flipped {
            transform: rotateY(180deg);
        }

        .fc-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border: 2px solid var(--ink);
            border-radius: 4px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .fc-front {
            color: #fff;
            background-image: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .08) 0 14px, rgba(255, 255, 255, 0) 14px 28px);
        }

        .fc-back {
            background: var(--card);
            transform: rotateY(180deg);
        }

        .fc-label {
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            letter-spacing: 1.5px;
            opacity: .75;
            margin-bottom: 10px;
        }

        .fc-term {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
        }

        .fc-def {
            font-size: 15px;
            font-weight: 500;
            line-height: 1.5;
        }

        .fc-hint {
            position: absolute;
            bottom: 12px;
            font-size: 11px;
            color: var(--ink-soft);
            font-family: 'Space Mono', monospace;
        }

        .fc-controls {
            display: flex;
            gap: 8px;
        }

        .fc-controls .nav-btn {
            flex: 0 0 46px;
            font-size: 16px;
        }

        .fc-mid-btn {
            flex: 1;
            padding: 13px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 13px;
            border: 2px solid;
            box-shadow: var(--shadow-sm);
        }

        .fc-mid-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .fc-know {
            border-color: #2F6F4E;
            background: #EAF4EE;
            color: #204B36;
        }

        .fc-again {
            border-color: #B94B3E;
            background: #FBEAE7;
            color: #7C3126;
        }

        /* ---------- QUIZ ---------- */
        .q-card {
            background: var(--card);
            border: 2px solid var(--ink);
            border-radius: 3px;
            box-shadow: var(--shadow);
            padding: 22px;
            margin-bottom: 16px;
        }

        .q-kicker {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            letter-spacing: 1px;
            color: var(--ink-soft);
            margin-bottom: 10px;
        }

        .q-text {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.35;
        }

        .options {
            list-style: none;
        }

        .opt {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            border: 2px solid var(--ink);
            border-radius: 4px;
            padding: 12px 14px;
            margin-bottom: 9px;
            background: var(--card);
            font-size: 14px;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .opt:not(.disabled):active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .opt.correct {
            background: #EAF4EE;
            border-color: #2F6F4E;
            color: #204B36;
        }

        .opt.wrong {
            background: #FBEAE7;
            border-color: #B94B3E;
            color: #7C3126;
        }

        .opt.faded {
            opacity: .4;
        }

        .opt-mark {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
        }

        .hint-btn {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 700;
            text-decoration: underline;
            color: var(--ink-soft);
            margin-top: 6px;
        }

        .hint-box {
            background: #FCF3DC;
            border: 2px dashed #C08A1E;
            padding: 10px 14px;
            font-size: 13px;
            margin-top: 8px;
            border-radius: 3px;
            color: #6B4F14;
        }

        .explain-box {
            background: var(--paper);
            border: 2px solid var(--ink);
            border-radius: 3px;
            padding: 14px 16px;
            margin-top: 14px;
        }

        .explain-tag {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .explain-text {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .quiz-done {
            text-align: center;
            padding: 40px 16px;
        }

        .quiz-done .score {
            font-family: 'Space Mono', monospace;
            font-size: 44px;
            font-weight: 700;
            margin: 14px 0 6px;
        }

        /* ---------- BOTTOM NAV (mobile) ---------- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            border-top: 2px solid var(--ink);
            display: none;
            z-index: 50;
        }

        .bottom-nav-inner {
            max-width: 760px;
            margin: 0 auto;
            display: flex;
        }

        .bn-btn {
            flex: 1;
            padding: 10px 4px calc(8px + env(safe-area-inset-bottom));
            background: none;
            border: none;
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--ink-soft);
        }

        .bn-btn.active {
            color: var(--ink);
        }

        .bn-icon {
            display: block;
            font-family: 'Space Mono', monospace;
            font-size: 16px;
            margin-bottom: 2px;
        }

        @media(max-width:600px) {
            .bottom-nav {
                display: block;
            }

            body {
                padding-bottom: 56px;
            }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <header class="site-header">
        <div class="brand">
            <div class="stamp">REVISED</div>
            <div>
                <div class="brand-name">Study Ledger</div>
                <div class="brand-sub">Unit 3 · Personal &amp; Business Finance</div>
            </div>
        </div>
    </header>

    <div class="wrap" id="app"></div>

    <div class="bottom-nav" id="bottomNav"></div>

    <script>
        /* =========================================================
           DATA
           ========================================================= */
        const TOPICS = [
            { id: "purpose", name: "Purpose of Accounting", short: "Purpose", accent: "#B94B3E", accentSoft: "#FBEAE7" },
            { id: "income", name: "Types of Income", short: "Income", accent: "#2F6F4E", accentSoft: "#EAF4EE" },
            { id: "expenditure", name: "Types of Expenditure", short: "Expenditure", accent: "#C08A1E", accentSoft: "#FCF3DC" },
            { id: "finance", name: "Sources of Finance", short: "Finance", accent: "#33578C", accentSoft: "#E9EFF7" }
        ];
        const topicById = Object.fromEntries(TOPICS.map(t => [t.id, t]));

        const LESSONS = {
            purpose: [
                {
                    title: "What is accounting?", points: [
                        "Accounting means recording every **financial transaction** a business makes — planned or actual — then turning those records into financial information.",
                        "A financial transaction is any time money moves in or out of the business — e.g. making a sale, or paying a bill.",
                        "Think of it as **'numbers paint a thousand words'** — owners, employees and investors all judge how a business is really doing by its accounts, not just by the idea behind it.",
                        "A brilliant business idea with poor financial records is 'almost certain to be doomed to failure' — the numbers have to back up the idea."
                    ]
                },
                {
                    title: "Record transactions", points: [
                        "The owner or a bookkeeper must record **all money coming in** (sales) and **all money going out** (expenses) — every transaction, not just the big ones.",
                        "Why it matters:\n– If it isn't done, bills go unpaid and payments never get chased up\n– Wrong records mean wrong figures reported to HMRC, so the business may pay the wrong amount of tax",
                        "**HMRC** (HM Revenue & Customs) is the UK government department that collects all types of tax — it relies on businesses reporting accurately."
                    ]
                },
                {
                    title: "Management of the business", points: [
                        "A manager's job is to **plan, monitor and control** the resources they're responsible for — staff, materials, stock and money.",
                        "Clear, accurate accounts let a manager make informed decisions and plan ahead, e.g. can we afford to hire someone or order more stock?",
                        "The core balancing act: money coming in from sales has to cover money going out — wages, new stock, bills and other cash outflows."
                    ]
                },
                {
                    title: "Compliance", points: [
                        "Financial reporting is controlled by **laws and regulations**, so every business's records give a fair and accurate picture.",
                        "Why compliance matters:\n– Protects investors and other stakeholders from being misinformed about how the business is really performing\n– Helps guard against fraud",
                        "**Fraud** = when company money is used inappropriately, or acquired by the wrong person, for personal gain, through illegal actions.",
                        "Example: without regulation, a struggling business could publish misleading accounts to attract investors who'd otherwise stay away."
                    ]
                },
                {
                    title: "Measuring performance", points: [
                        "Without financial records a business can't tell whether it's making a **profit** (revenue higher than costs) or a **loss** (costs higher than revenue).",
                        "**Gross profit** = sales revenue − cost of goods sold (the cost of the materials used to make what was sold).",
                        "**Net profit** = gross profit − all other expenses, e.g. rent and advertising. This is the 'real' bottom-line profit figure.",
                        "Records also reveal value owed TO the business (unpaid sales) and value owed BY the business (unpaid bills) — essential for knowing if it's in debt to others."
                    ]
                },
                {
                    title: "Control", points: [
                        "**Trade receivables** = money owed TO the business — customers who bought on credit but haven't paid yet.",
                        "**Trade payables** = money owed BY the business — suppliers it bought from on credit but hasn't paid yet.",
                        "**Credit control** = making sure everyone who owes the business money pays on time, so it can meet its own day-to-day bills.",
                        "If receivables and payables aren't carefully controlled, the business risks running out of cash to survive — even if it looks profitable on paper."
                    ]
                },
                {
                    title: "Key terms recap", points: [
                        "**HMRC** — the UK government department responsible for collecting all types of tax.",
                        "**Fraud** — when an individual acquires company money for personal gain, through illegal actions.",
                        "**Asset** — any item of value owned by an individual or a business, e.g. cash, equipment, property.",
                        "**Amortisation** — spreading the repayment of a loan, or the cost of an intangible asset (like a patent), over a set period of time — a similar idea to depreciation."
                    ]
                }
            ],
            income: [
                {
                    title: "Two types of income", points: [
                        "**Capital income** — money invested by owners or other investors to set up or grow a business. Used for things that stay in the business medium-to-long term, e.g. premises, vehicles, equipment — these are called **fixed assets**.",
                        "**Revenue income** — money from the business's day-to-day trading: selling goods or providing a service.",
                        "Rule of thumb: capital income is a one-off injection to build the business; revenue income keeps flowing in from normal, everyday trading."
                    ]
                },
                {
                    title: "Loans", points: [
                        "A **loan** is a lump sum borrowed from a bank or financial institution, repaid at a set amount each month, often over around 5 years (though longer terms can be agreed).",
                        "On top of repaying the loan itself, the business pays **interest** — a charge for borrowing, calculated as a % of the amount borrowed, which can be fixed or variable.",
                        "**Advantages:**\n– Regular, pre-agreed repayments make planning and budgeting easier\n– Ownership and control of the business is not lost",
                        "**Disadvantages:**\n– Interest makes it a relatively expensive source of finance, and it must be paid even if the business isn't making a profit\n– Often secured against an asset (e.g. the owner's home or company vehicles), which the bank can claim if repayments are missed"
                    ]
                },
                {
                    title: "Mortgages", points: [
                        "A **mortgage** works like a bigger, longer version of a loan — typically around 25 years — used to buy premises such as a factory, shop or warehouse.",
                        "Mortgages are always **secured against an asset**, normally the property itself.",
                        "**Advantages:**\n– Large amounts of finance can be raised and repaid over a long period\n– Ownership and control of the business is not lost",
                        "**Disadvantages:**\n– Interest is charged and rates can fluctuate over time\n– The asset can be seized if repayments are missed; not suitable for small amounts or short-term needs"
                    ]
                },
                {
                    title: "Shares", points: [
                        "When a business registers with **Companies House** it becomes a company and can issue **shares** to shareholders.",
                        "Shareholders are part-owners of the business — the more shares they hold, the more say (voting right) they have in decisions.",
                        "In return for investing, shareholders are rewarded with a **dividend** — a share of the profits."
                    ]
                },
                {
                    title: "Owner's capital & partnerships", points: [
                        "**Owner's capital** = money invested in the business from the owner's own personal savings.",
                        "A **sole trader** funds the business entirely from their own savings or personal loans — often secured against their own house.",
                        "This is high risk (the sole trader is personally responsible for all the business's debts) but if it succeeds, they keep 100% of the profit for themselves.",
                        "A **partnership** shares the capital, decision-making and profit between two or more people — spreading the risk, though loans are still usually secured against the partners' own assets."
                    ]
                },
                {
                    title: "Debentures", points: [
                        "A **debenture** is a medium- to long-term form of loan capital, often used by large companies to secure income.",
                        "It pays interest, normally at a **fixed rate**, and the debenture itself is repaid as one lump sum on a pre-agreed date. It can be secured against an asset.",
                        "**Advantages:**\n– The fixed interest rate makes repayments predictable, so it's easy to budget for\n– No shares are issued, so ownership and control of the business stay the same",
                        "**Disadvantages:**\n– Interest still has to be paid even if the business isn't profitable\n– A large lump sum has to be found to repay it in full on the agreed date"
                    ]
                },
                {
                    title: "Sales & rent received", points: [
                        "**Sales (sales turnover)** = money coming in from selling goods or services. It's determined by the price charged and the number of customers.",

                    explain: q.explain,
                    options: order.map(i => q.options[i]),
                    correct: order.indexOf(q.correct)
                };
            });
        }

        /* =========================================================
           STATE
           ========================================================= */
        let state = {
            view: "home",       // home | topic
            topic: null,
            mode: "lesson",      // lesson | cards | quiz
            lessonIndex: 0,
            cardIndex: 0,
            cardFlipped: false,
            cardKnown: {},
            quizIndex: 0,
            quizSet: [],
            quizSelected: null,
            quizScore: 0,
            quizDone: false,
            showHint: false
        };

        const app = document.getElementById("app");
        const bottomNav = document.getElementById("bottomNav");

        function go(view, opts = {}) {
            state.view = view;
            Object.assign(state, opts);
            render();
        }
        function openTopic(id, mode) {
            state.topic = id;
            state.mode = mode || "lesson";
            state.lessonIndex = 0; state.cardIndex = 0; state.cardFlipped = false;
            state.quizIndex = 0; state.quizSelected = null; state.quizScore = 0; state.quizDone = false; state.showHint = false;
            if (state.mode === "quiz") state.quizSet = buildQuizSet(id);
            go("topic");
        }
        function setMode(mode) {
            state.mode = mode;
            state.lessonIndex = 0; state.cardIndex = 0; state.cardFlipped = false;
            state.quizIndex = 0; state.quizSelected = null; state.quizScore = 0; state.quizDone = false; state.showHint = false;
            if (mode === "quiz") state.quizSet = buildQuizSet(state.topic);
            render();
        }

        /* =========================================================
           RENDER: HOME
           ========================================================= */
        function renderHome() {
            bottomNav.innerHTML = "";
            app.innerHTML = `
    <p class="home-title">Choose a topic to start.</p>
    <div class="folders">
      ${TOPICS.map(t => `
        <div class="folder" data-topic="${t.id}" onclick="openTopic('${t.id}')">
          <div class="holes"><span></span><span></span><span></span></div>
          <span class="tag">${t.short.toUpperCase()}</span>
          <h3>${t.name}</h3>
          <p>Lesson · Flashcards · Quiz</p>
        </div>
      `).join("")}
    </div>
    <div class="tip"><b>How to use this:</b> run the Lesson slideshow first to see the facts in order, then drill weak spots with Flashcards, then check yourself with the Quiz.</div>
  `;
        }

        /* =========================================================
           RENDER: TOPIC WORKSPACE
           ========================================================= */
        function renderTopic() {
            const t = topicById[state.topic];
            document.documentElement.style.setProperty("--current-accent", t.accent);

            let body = "";
            if (state.mode === "lesson") body = renderLesson(t);
            if (state.mode === "cards") body = renderCards(t);
            if (state.mode === "quiz") body = renderQuiz(t);

            app.innerHTML = `
    <button class="back-link" onclick="go('home')">&larr; All topics</button>
    <div class="topic-head">
      <span class="dot" style="background:${t.accent}"></span>
      <h2>${t.name}</h2>
    </div>
    <div class="tabs">
      <button class="tab-btn ${state.mode === 'lesson' ? 'active' : ''}" onclick="setMode('lesson')">Lesson</button>
      <button class="tab-btn ${state.mode === 'cards' ? 'active' : ''}" onclick="setMode('cards')">Flashcards</button>
      <button class="tab-btn ${state.mode === 'quiz' ? 'active' : ''}" onclick="setMode('quiz')">Quiz</button>
    </div>
    ${body}
  `;

            bottomNav.innerHTML = `
    <div class="bottom-nav-inner">
      <button class="bn-btn ${state.mode === 'lesson' ? 'active' : ''}" onclick="setMode('lesson')"><span class="bn-icon">≡</span>Lesson</button>
      <button class="bn-btn ${state.mode === 'cards' ? 'active' : ''}" onclick="setMode('cards')"><span class="bn-icon">▭▭</span>Cards</button>
      <button class="bn-btn ${state.mode === 'quiz' ? 'active' : ''}" onclick="setMode('quiz')"><span class="bn-icon">?</span>Quiz</button>
      <button class="bn-btn" onclick="go('home')"><span class="bn-icon">⌂</span>Topics</button>
    </div>
  `;
        }

        /* ---------- LESSON ---------- */
        function bold(text) {
            return text.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        }
        function fmtPoint(p) {
            const lines = p.split("\n");
            const head = bold(lines[0]);
            const rest = lines.slice(1).map(l => `<span class="sub-point">${bold(l)}</span>`).join("");
            return head + rest;
        }
        function renderLesson(t) {
            const slides = LESSONS[t.id];
            const i = state.lessonIndex;
            const s = slides[i];
            const pct = Math.round(((i + 1) / slides.length) * 100);
            return `
    <div class="lesson-topbar">
      <span class="slide-counter">SLIDE ${i + 1} / ${slides.length}</span>
      <button class="skip-btn" onclick="lessonJump(${slides.length - 1})">Skip to end</button>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%; background:${t.accent}"></div></div>
    <div class="slide-card">
      <div style="position:absolute; left:0; top:0; bottom:0; width:5px; background:${t.accent}"></div>
      <div class="slide-kicker" style="color:${t.accent}">${t.short.toUpperCase()}</div>
      <h3 class="slide-title">${s.title}</h3>
      <ul class="slide-points">${s.points.map(p => `<li>${fmtPoint(p)}</li>`).join("")}</ul>
    </div>
    <div class="lesson-nav">
      <button class="nav-btn" ${i === 0 ? 'disabled' : ''} onclick="lessonJump(${i - 1})">&larr; Back</button>
      ${i === slides.length - 1
                    ? `<button class="nav-btn primary" onclick="setMode('quiz')">Take the quiz &rarr;</button>`
                    : `<button class="nav-btn primary" onclick="lessonJump(${i + 1})">Next &rarr;</button>`
                }
    </div>
  `;
        }
        function lessonJump(i) { state.lessonIndex = i; render(); }

        /* ---------- FLASHCARDS ---------- */
        function renderCards(t) {
            const terms = TERMS[t.id];
            const i = state.cardIndex;
            const [term, def] = terms[i];
            const knownCount = Object.keys(state.cardKnown).filter(k => k.startsWith(t.id + "-") && state.cardKnown[k]).length;
            return `
    <div class="fc-topbar">
      <span>${i + 1} / ${terms.length}</span>
      <span>${knownCount} known</span>
    </div>
    <div class="fc-stage">
      <div class="fc-card ${state.cardFlipped ? 'flipped' : ''}" onclick="flipCard()">
        <div class="fc-face fc-front" style="background:${t.accent}">
          <div class="fc-label">TERM</div>
          <div class="fc-term">${term}</div>
          <div class="fc-hint" style="color:rgba(255,255,255,.75)">tap to flip</div>
        </div>
        <div class="fc-face fc-back">
          <div class="fc-label" style="color:${t.accent}">DEFINITION</div>
          <div class="fc-def">${def}</div>
        </div>
      </div>
    </div>
    <div class="fc-controls">
      <button class="nav-btn" onclick="cardStep(-1)">&larr;</button>
      <button class="fc-mid-btn fc-again" onclick="markCard(false)">Still learning</button>
      <button class="fc-mid-btn fc-know" onclick="markCard(true)">Know it</button>
      <button class="nav-btn" onclick="cardStep(1)">&rarr;</button>
    </div>
  `;
        }
        function flipCard() { state.cardFlipped = !state.cardFlipped; render(); }
        function cardStep(dir) {
            const terms = TERMS[state.topic];
            state.cardFlipped = false;
            state.cardIndex = (state.cardIndex + dir + terms.length) % terms.length;
            render();
        }
        function markCard(known) {
            state.cardKnown[state.topic + "-" + state.cardIndex] = known;
            cardStep(1);
        }

        /* ---------- QUIZ ---------- */
        function renderQuiz(t) {
            const qs = state.quizSet;
            if (state.quizDone) {
                const pct = Math.round((state.quizScore / qs.length) * 100);
                let msg = "Worth another pass — check the Lesson slides first.";
                if (state.quizScore === qs.length) msg = "Perfect score. Try another topic.";
                else if (pct >= 50) msg = "Solid work — review the ones you missed and go again.";
                return `
      <div class="q-card quiz-done">
        <div class="q-kicker" style="color:${t.accent}">RESULT</div>
        <div class="score">${state.quizScore}/${qs.length}</div>
        <p style="color:var(--ink-soft); margin-bottom:18px;">${msg}</p>
        <button class="nav-btn primary" onclick="setMode('quiz')">Retry this topic</button>
      </div>
    `;
            }
            const i = state.quizIndex;
            const q = qs[i];
            const answered = state.quizSelected !== null;
            return `
    <div class="q-card">
      <div class="q-kicker" style="color:${t.accent}">QUESTION ${i + 1} OF ${qs.length} &nbsp;·&nbsp; SCORE ${state.quizScore}</div>
      <div class="q-text">${q.q}</div>
    </div>
    <ul class="options">
      ${q.options.map((opt, oi) => {
                let cls = "opt";
                if (answered) {
                    if (oi === q.correct) cls += " correct";
                    else if (oi === state.quizSelected) cls += " wrong";
                    else cls += " faded";
                }
                let mark = "";
                if (answered && oi === q.correct) mark = "✓";
                if (answered && oi === state.quizSelected && oi !== q.correct) mark = "✕";
                return `<li class="${cls}" onclick="${answered ? '' : 'chooseOption(' + oi + ')'}"><span>${opt}</span><span class="opt-mark">${mark}</span></li>`;
            }).join("")}
    </ul>
    ${!answered ? `
      <button class="hint-btn" onclick="toggleHint()">${state.showHint ? 'Hide hint' : 'Show hint'}</button>
      ${state.showHint ? `<div class="hint-box">${q.hint}</div>` : ""}
    ` : `
      <div class="explain-box">
        <div class="explain-tag" style="color:${t.accent}">${state.quizSelected === q.correct ? "CORRECT" : "NOT QUITE"}</div>
        <div class="explain-text">${q.explain}</div>
        <button class="nav-btn primary" onclick="nextQuestion()">${i + 1 >= qs.length ? "See results →" : "Next question →"}</button>
      </div>
    `}
  `;
        }
        function chooseOption(oi) {
            const q = state.quizSet[state.quizIndex];
            state.quizSelected = oi;
            state.showHint = false;
            if (oi === q.correct) state.quizScore++;
            render();
        }
        function toggleHint() { state.showHint = !state.showHint; render(); }
        function nextQuestion() {
            const qs = state.quizSet;
            if (state.quizIndex + 1 >= qs.length) { state.quizDone = true; }
            else { state.quizIndex++; state.quizSelected = null; state.showHint = false; }
            render();
        }

        /* =========================================================
           MAIN RENDER
           ========================================================= */
        function render() {
            if (state.view === "home") renderHome();
            else renderTopic();
            window.scrollTo(0, 0);
        }
        render();
    </script>
</body>

</html>
